<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>709打掃檢查紀錄</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;background:#eef1f5;color:#111}
body{display:flex;flex-direction:column}
header{padding:5px 12px;background:#1f3a5f;color:#fff;display:flex;gap:12px;align-items:center;flex-shrink:0}
header h1{font-size:18px;margin:0;white-space:nowrap}#hdr{font-size:16px;font-weight:700;white-space:nowrap}#st{margin-left:auto;font-size:14px;white-space:nowrap}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1.12fr 1.18fr 0.95fr;gap:8px;padding:8px;overflow:hidden}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;height:100%}
.box{background:#fff;border:2px solid #b8c2cc;border-radius:10px;padding:6px 9px;display:flex;flex-direction:column;min-height:0}
#b_in{height:100%}
#b_ma{flex:8}#b_fe{flex:6}
#b_ed{flex-shrink:0;border-color:#1f3a5f}
#b_fail{flex:1;min-height:0;border-color:#d93025}
h2{font-size:16px;margin:0 0 4px;color:#1f3a5f;flex-shrink:0;line-height:1.2}
.list{flex:1;min-height:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:6px;padding:1px 2px;border-bottom:1px solid #e3e7ec;flex:1;min-height:0}
.row:last-child{border-bottom:0}
.row .seat{font-size:16px;font-weight:800;color:#1f3a5f;width:26px;flex-shrink:0}
.row .job{flex:1;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
select{font-size:13.5px;padding:1px 4px;border-radius:6px;border:1.5px solid #9aa7b5;height:26px;background:#fff;color:#111}
select.ok{background:#e6f6ea;color:#0b6b2b;border-color:#1e8e3e;font-weight:700}
select.ng{background:#fde8e8;color:#a50e0e;border-color:#d93025;font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
.ctl label{font-weight:700;font-size:14px;white-space:nowrap}
input[type=date]{font-size:13.5px;padding:2px 5px;border-radius:6px;border:1.5px solid #9aa7b5;height:28px;min-width:0}
button{font-size:13px;font-weight:700;height:28px;padding:0 8px;border-radius:7px;border:1.5px solid #1a56db;background:#eaf1ff;color:#1a56db;cursor:pointer;white-space:nowrap}
.allgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:5px 0}
.allitem{display:flex;flex-direction:column;gap:2px}
.allitem label{font-size:12.5px;font-weight:700;color:#1f3a5f}
.allitem select{width:100%;height:28px}
.cnt{display:flex;gap:6px;flex-wrap:wrap;font-size:14.5px;font-weight:700;margin:6px 0}
.cnt span{padding:3px 8px;border-radius:7px;flex:1;text-align:center}.c1{background:#e6f6ea;color:#0b6b2b}.c2{background:#fde8e8;color:#a50e0e}.c3{background:#eef1f5}
#save{background:#1a56db;color:#fff;width:100%;font-size:17px;height:40px;margin-top:4px;border-radius:9px}
#msg{font-weight:700;font-size:13.5px;min-height:19px;margin-top:4px}
#sessTime{font-size:13px;color:#555}
#fl{flex:1;min-height:0;overflow-y:auto}
.fi{display:flex;gap:6px;align-items:baseline;padding:4px 2px;border-bottom:1px solid #f3d0d0;flex-wrap:wrap}
.fi .seat{font-size:16px;font-weight:800;color:#a50e0e;width:26px}
.fi .c{font-weight:800;font-size:13px;color:#a50e0e;background:#fde8e8;border-radius:5px;padding:1px 6px}
.fi .dt{flex:1;font-size:13.5px;min-width:120px}
.muted{color:#777;font-size:14px}
@media(max-width:900px){
 html,body{height:auto;overflow:auto}
 .wrap{display:flex;flex-direction:column;overflow:visible;gap:10px;padding:10px}
 .col{display:contents}
 #b_ed{order:1}#b_in{order:2;height:auto}#b_fe{order:3}#b_ma{order:4}#b_fail{order:5}
 .row{flex:none;padding:6px 2px}.row .seat{font-size:19px;width:32px}.row .job{font-size:15.5px;white-space:normal}
 select,input[type=date]{height:38px;font-size:16px}
 button{height:38px;font-size:15px;padding:0 12px}
 .allitem select{height:38px}
 #save{height:50px;font-size:20px}
 #fl{max-height:360px}
}
</style></head><body>
<header><h1>709打掃檢查紀錄</h1><span id="hdr"></span><span id="st">讀取中…</span></header>
<div class="wrap">
<div class="box" id="b_in"><h2>內掃區</h2><div class="list" id="l_in"></div></div>
<div class="col" id="col_mid">
 <div class="box" id="b_ma"><h2>男廁（含司令台）</h2><div class="list" id="l_ma"></div></div>
 <div class="box" id="b_fe"><h2>女廁</h2><div class="list" id="l_fe"></div></div>
</div>
<div class="col" id="col_rt">
 <div class="box" id="b_ed"><h2>統計編輯區</h2>
  <div class="ctl"><label>日期</label><input type="date" id="date"><button id="prevDay">前一天</button><button id="prevWeek">前一週</button><button id="today">今天</button></div>
  <div class="ctl"><label>時段</label><select id="sess"><option>早上</option><option>中午</option><option>下午</option></select><span id="sessTime"></span></div>
  <div class="allgrid">
   <div class="allitem"><label>全選內掃</label><select data-all="in"><option value="">請選擇</option><option>打掃完成</option><option>打掃未通過</option></select></div>
   <div class="allitem"><label>全選男廁</label><select data-all="ma"><option value="">請選擇</option><option>打掃完成</option><option>打掃未通過</option></select></div>
   <div class="allitem"><label>全選女廁</label><select data-all="fe"><option value="">請選擇</option><option>打掃完成</option><option>打掃未通過</option></select></div>
  </div>
  <div class="cnt"><span class="c1">完成 <b id="n1">0</b></span><span class="c2">未通過 <b id="n2">0</b></span><span class="c3">未選 <b id="n3">0</b></span></div>
  <button id="save">✔ 儲存</button><div id="msg"></div>
 </div>
 <div class="box" id="b_fail"><h2 style="color:#a50e0e">近一個月打掃未通過名單</h2><div id="fl"><span class="muted">讀取中…</span></div></div>
</div>
</div>
<script>
var API='https://script.google.com/macros/s/AKfycbywQvfNKWqSi5ZpAnwFmTw00T40NidyTA86j6p6bF6QxrR6rMJ1UJ5XWUte7TCQSWwR/exec';
var TIMES={'早上':'07:30–07:40','中午':'12:15–12:30','下午':'14:50–15:05'};
var R={in:[['11','內掃負責人：排掃具'],['21','講台、黑板'],['27','講台、黑板'],['03','左掃地'],['04','右掃地'],['31','左拖地'],['34','右拖地'],['05','左窗'],['10','左窗'],['13','左窗'],['24','右窗'],['26','右窗'],['38','導師桌與地板掃拖'],['25','陽台掃拖與洗手台'],['36','垃圾與回收整理'],['32','午餐整理','中午']],
fe:[['08','女廁負責人：排掃具'],['12','女廁垃圾整理'],['09','女便盆刷洗'],['02','洗手台刷洗與擦乾'],['06','地板（含便盆周圍地板）'],['07','地板（含便盆周圍地板）']],
ma:[['29','男廁負責人：排掃具'],['35','男廁垃圾整理'],['28','小便斗刷洗'],['22','洗手台刷洗與擦乾'],['23','地板（含便盆周圍及身心障礙廁所地板）'],['33','地板（含便盆周圍及身心障礙廁所地板）'],['30','男便盆、身心障礙馬桶刷洗'],['01','廁所前、司令台、升旗台地板']]};
function $(id){return document.getElementById(id)}
function sessFor(h){return h<11?'早上':(h<14?'中午':'下午')}
function tpeNow(){var d=new Date(Date.now()+8*3600e3);return {date:d.toISOString().slice(0,10),h:d.getUTCHours()}}
function shift(ds,n){var d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function color(s){s.className=s.value==='打掃完成'?'ok':(s.value==='打掃未通過'?'ng':'')}
function active(s){return !s.dataset.only||s.dataset.only===$('sess').value}
function syncRows(){var se=$('sess').value;document.querySelectorAll('.row[data-only]').forEach(function(row){var show=row.dataset.only===se;row.style.display=show?'':'none';if(!show){var s=row.querySelector('select');s.value='';color(s);}})}
function build(){Object.keys(R).forEach(function(k){var box=$('l_'+k);R[k].forEach(function(r){
 var d=document.createElement('div');d.className='row';if(r[2])d.dataset.only=r[2];
 d.innerHTML='<span class="seat">'+r[0]+'</span><span class="job" title="'+r[1]+'">'+r[1]+'</span><select data-seat="'+r[0]+'" data-g="'+k+'"'+(r[2]?' data-only="'+r[2]+'"':'')+'><option value="">請選擇</option><option>打掃完成</option><option>打掃未通過</option></select>';
 box.appendChild(d);});});
 document.querySelectorAll('select[data-seat]').forEach(function(s){s.onchange=function(){color(s);count();dirty=true}});
 document.querySelectorAll('select[data-all]').forEach(function(a){a.onchange=function(){if(!a.value)return;
  document.querySelectorAll('select[data-g="'+a.dataset.all+'"]').forEach(function(s){if(!active(s))return;s.value=a.value;color(s)});a.value='';count();dirty=true}});}
var dirty=false;
function renderFail(list){var el=$('fl');if(!list)return;el.innerHTML='';
 if(!list.length){el.innerHTML='<span class="muted">近一個月無未通過紀錄</span>';return}
 list.forEach(function(x){var d=document.createElement('div');d.className='fi';
  var a=document.createElement('span');a.className='seat';a.textContent=x.seat;
  var b=document.createElement('span');b.className='c';b.textContent='累積'+x.count+'次';
  var c=document.createElement('span');c.className='dt';c.textContent=x.details.map(function(t){return t.text}).join('、');
  d.appendChild(a);d.appendChild(b);d.appendChild(c);el.appendChild(d)})}
function count(){var a=0,b=0,c=0;document.querySelectorAll('select[data-seat]').forEach(function(s){if(!active(s))return;if(s.value==='打掃完成')a++;else if(s.value==='打掃未通過')b++;else c++});$('n1').textContent=a;$('n2').textContent=b;$('n3').textContent=c}
function call(fn,args){return fetch(API,{method:'POST',redirect:'follow',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'錯誤');return j.result})}
function hdr(){$('hdr').textContent=$('date').value+' '+$('sess').value;$('sessTime').textContent=TIMES[$('sess').value]}
function load(){hdr();syncRows();$('st').textContent='讀取中…';$('msg').textContent='';
 document.querySelectorAll('select[data-seat]').forEach(function(s){s.value='';color(s)});count();
 var d=$('date').value,se=$('sess').value;
 call('cleanGet',[d,se]).then(function(r){renderFail(r.recentFailed);if(d!==$('date').value||se!==$('sess').value)return;
  document.querySelectorAll('select[data-seat]').forEach(function(s){s.value=active(s)?(r.results[s.dataset.seat]||''):'';color(s)});count();dirty=false;
  $('st').textContent=r.updated?('已儲存 '+r.updated):'尚無紀錄';}).catch(function(e){$('st').textContent='讀取失敗：'+e.message})}
function change(){if(dirty&&!confirm('尚未儲存，確定切換？'))return false;dirty=false;load();return true}
$('save').onclick=function(){var res={};document.querySelectorAll('select[data-seat]').forEach(function(s){if(active(s)&&s.value)res[s.dataset.seat]=s.value});
 $('save').disabled=true;$('msg').textContent='儲存中…';
 call('cleanSave',[$('date').value,$('sess').value,res]).then(function(r){renderFail(r.recentFailed);dirty=false;$('msg').textContent='✅ 已儲存 '+r.saved+' 筆（'+r.updated+'）';$('st').textContent='已儲存 '+r.updated})
 .catch(function(e){$('msg').textContent='❌ 儲存失敗：'+e.message}).then(function(){$('save').disabled=false})};
$('date').onchange=change;$('sess').onchange=change;
$('prevDay').onclick=function(){$('date').value=shift($('date').value,-1);change()};
$('prevWeek').onclick=function(){$('date').value=shift($('date').value,-7);change()};
$('today').onclick=function(){var t=tpeNow();$('date').value=t.date;$('sess').value=sessFor(t.h);change()};
window.onbeforeunload=function(e){if(dirty){e.preventDefault();return ''}};
build();var t=tpeNow();$('date').value=t.date;$('sess').value=sessFor(t.h);load();
</script></body></html>
